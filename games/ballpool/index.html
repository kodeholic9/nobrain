<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>동전 키우기 게임</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../css/popup.css" />
  </head>
  <body>
    <div class="game-container">
      <!-- 상단 헤더 -->
      <header class="header">
        <div class="header-content">
          <h1 class="game-title">동전 키우기 게임</h1>
          <button class="settings-btn" id="settingsBtn">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V6a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- 설정 팝업 -->
      <div class="settings-popup" id="settingsPopup">
        <div class="settings-content">
          <div class="settings-header">
            <h3>게임 설정</h3>
            <button class="close-btn" id="closeSettingsBtn">×</button>
          </div>
          <div class="settings-buttons">
            <button class="setting-btn" id="newGame">새게임</button>
            <button class="setting-btn" id="debugBtn">디버그</button>
            <button class="setting-btn" id="gameSettingsBtn">게임설정</button>
            <button class="setting-btn" id="ballCheckBtn">공 확인</button>
            <button class="setting-btn" id="autoDropBtn">자동 drop</button>
            <!-- 확장성을 위한 추가 버튼 영역 -->
            <div class="additional-buttons" id="additionalButtons">
              <!-- 동적으로 추가될 버튼들 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 게임오버 팝업 -->
      <div class="settings-popup" id="gamePopup">
        <div class="settings-content">
          <div class="settings-header">
            <h3>알림</h3>
            <button class="close-btn" id="closeGameBtn">×</button>
          </div>
          <div class="settings-buttons">
            <div
              id="additionalText"
              style="
                white-space: pre-wrap;
                text-align: left;
                margin-bottom: 16px;
              "
            >
              <!-- 동적으로 추가될 버튼들 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 게임 영역 -->
      <main class="game-area">
        <div class="game-board">
          <!-- 캔버스 영역 -->
          <div id="canvasContainer" class="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <!-- drop 존 -->
            <div id="dropZone" class="drop-zone"></div>
            <div id="dropLine" class="drop-line"></div>

            <!-- 점수 영역 -->
            <div class="score-area">
              <div class="score-item">
                <span class="score-label">최고점수</span>
                <span class="score-value" id="bestScoreValue">0</span>
              </div>
              <div class="score-item">
                <span class="score-label">점수</span>
                <span class="score-value" id="scoreValue">0</span>
              </div>
              <div class="score-item">
                <span class="score-label">다음공</span>
                <img
                  class="score-value"
                  src=""
                  id="nextBall"
                  style="width: 16px; height: 16px"
                />
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- 하단 카피라이트 -->
      <footer class="footer">
        <p>&copy; jjangnan.xyz</p>
      </footer>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
