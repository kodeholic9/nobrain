<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design System</title>
    <link rel="stylesheet" href="../css/themes.css" />
    <link rel="stylesheet" href="../css/scrollbar.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/config.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }

      .layout {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .header {
        height: 60px;
        border-bottom: 1px solid hsl(var(--border));
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
      }

      .main-content {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .sidebar {
        width: 260px;
        border-right: 1px solid hsl(var(--border));
        overflow-y: auto;
        padding: 1rem;
      }

      .content-frame {
        flex: 1;
        overflow: hidden;
      }

      /* Custom Scrollbar - shadcn style */
      /* Webkit browsers (Chrome, Safari, Edge) */
      .sidebar::-webkit-scrollbar {
        width: 8px;
      }

      .sidebar::-webkit-scrollbar-track {
        background: transparent;
      }

      .sidebar::-webkit-scrollbar-thumb {
        background: hsl(var(--muted-foreground) / 0.3);
        border-radius: 4px;
      }

      .sidebar::-webkit-scrollbar-thumb:hover {
        background: hsl(var(--muted-foreground) / 0.5);
      }

      /* Firefox */
      .sidebar {
        scrollbar-width: thin;
        scrollbar-color: hsl(var(--muted-foreground) / 0.3) transparent;
      }

      /* iframe scrollbar */
      iframe {
        scrollbar-width: thin;
        scrollbar-color: hsl(var(--muted-foreground) / 0.3) transparent;
      }

      .content-frame iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .nav-item {
        display: block;
        padding: 0.5rem 0.75rem;
        margin: 0.25rem 0;
        border-radius: 0.375rem;
        color: hsl(var(--foreground));
        text-decoration: none;
        font-size: 0.875rem;
        transition: all 0.2s;
        cursor: pointer;
      }

      .nav-item:hover {
        background: hsl(var(--accent));
        color: hsl(var(--accent-foreground));
      }

      .nav-item.active {
        background: hsl(var(--accent));
        color: hsl(var(--accent-foreground));
        font-weight: 500;
      }

      .nav-section {
        margin-bottom: 1.5rem;
      }

      .nav-section-title {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: hsl(var(--muted-foreground));
        margin-bottom: 0.5rem;
        padding: 0 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <!-- Header -->
      <header class="header">
        <h1 class="text-xl font-bold">Design System</h1>
        <div class="flex gap-2">
          <!-- Theme Switcher -->
          <select
            id="theme-select"
            class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground dark:bg-input/30 dark:border-input dark:hover:bg-input/50 h-9 px-3"
          >
            <option value="zinc">Zinc</option>
            <option value="slate">Slate</option>
            <option value="stone">Stone</option>
            <option value="gray">Gray</option>
            <option value="neutral">Neutral</option>
            <option value="red">Red</option>
            <option value="rose">Rose</option>
            <option value="orange">Orange</option>
            <option value="green">Green</option>
            <option value="blue">Blue</option>
            <option value="yellow">Yellow</option>
            <option value="violet">Violet</option>
          </select>

          <!-- Mode Switcher -->
          <button
            id="mode-toggle"
            class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg:not([class*='size-'])]:size-4 shrink-0 [&_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground dark:bg-input/30 dark:border-input dark:hover:bg-input/50 h-9 px-4 py-2"
          >
            Toggle Mode
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Sidebar -->
        <aside class="sidebar">
          <nav>
            <div class="nav-section">
              <div class="nav-section-title">Foundation</div>
              <a
                class="nav-item active"
                data-page="foundation.html"
                onclick="loadPage(event, this)"
              >
                Foundation
              </a>
              <a
                class="nav-item"
                data-page="layout.html"
                onclick="loadPage(event, this)"
              >
                Layout
              </a>
            </div>

            <div class="nav-section">
              <div class="nav-section-title">Components</div>
              <a
                class="nav-item"
                data-page="button.html"
                onclick="loadPage(event, this)"
              >
                Button
              </a>
              <a
                class="nav-item"
                data-page="input.html"
                onclick="loadPage(event, this)"
              >
                Input
              </a>
              <a
                class="nav-item"
                data-page="select.html"
                onclick="loadPage(event, this)"
              >
                Select
              </a>
              <a
                class="nav-item"
                data-page="textarea.html"
                onclick="loadPage(event, this)"
              >
                Textarea
              </a>
              <a
                class="nav-item"
                data-page="checkbox.html"
                onclick="loadPage(event, this)"
              >
                Checkbox
              </a>
              <a
                class="nav-item"
                data-page="radio-group.html"
                onclick="loadPage(event, this)"
              >
                Radio Group
              </a>
              <a
                class="nav-item"
                data-page="label.html"
                onclick="loadPage(event, this)"
              >
                Label
              </a>
              <a
                class="nav-item"
                data-page="separator.html"
                onclick="loadPage(event, this)"
              >
                Separator
              </a>
              <a
                class="nav-item"
                data-page="progress.html"
                onclick="loadPage(event, this)"
              >
                Progress
              </a>
              <a
                class="nav-item"
                data-page="tabs.html"
                onclick="loadPage(event, this)"
              >
                Tabs
              </a>
              <a
                class="nav-item"
                data-page="switch.html"
                onclick="loadPage(event, this)"
              >
                Switch
              </a>
              <a
                class="nav-item"
                data-page="drawer.html"
                onclick="loadPage(event, this)"
              >
                Drawer
              </a>
              <a
                class="nav-item"
                data-page="dialog.html"
                onclick="loadPage(event, this)"
              >
                Dialog
              </a>
              <a
                class="nav-item"
                data-page="toast.html"
                onclick="loadPage(event, this)"
              >
                Toast
              </a>
              <a
                class="nav-item"
                data-page="badge.html"
                onclick="loadPage(event, this)"
              >
                Badge
              </a>
              <a
                class="nav-item"
                data-page="card.html"
                onclick="loadPage(event, this)"
              >
                Card
              </a>
              <a
                class="nav-item"
                data-page="alert.html"
                onclick="loadPage(event, this)"
              >
                Alert
              </a>
              <a
                class="nav-item"
                data-page="accordion.html"
                onclick="loadPage(event, this)"
              >
                Accordion
              </a>
              <a
                class="nav-item"
                data-page="tooltip.html"
                onclick="loadPage(event, this)"
              >
                Tooltip
              </a>
              <a
                class="nav-item"
                data-page="skeleton.html"
                onclick="loadPage(event, this)"
              >
                Skeleton
              </a>
              <a
                class="nav-item"
                data-page="avatar.html"
                onclick="loadPage(event, this)"
              >
                Avatar
              </a>
              <a
                class="nav-item"
                data-page="data-table.html"
                onclick="loadPage(event, this)"
              >
                Data Table
              </a>
              <a
                class="nav-item"
                data-page="pagination.html"
                onclick="loadPage(event, this)"
              >
                Pagination
              </a>
              <a
                class="nav-item"
                data-page="slider.html"
                onclick="loadPage(event, this)"
              >
                Slider
              </a>
            </div>
          </nav>
        </aside>

        <!-- Content Frame -->
        <div class="content-frame">
          <iframe id="content-iframe" src="foundation.html"></iframe>
        </div>
      </div>
    </div>

    <script src="../js/theme-manager.js"></script>
    <script>
      // 테마 선택 이벤트
      const themeSelect = document.getElementById('theme-select');
      themeSelect.value = themeManager.getTheme();
      themeSelect.addEventListener('change', (e) => {
        themeManager.setTheme(e.target.value);
        syncThemeToIframe();
      });

      // 모드 토글 이벤트
      const modeToggle = document.getElementById('mode-toggle');
      modeToggle.addEventListener('click', () => {
        themeManager.toggleMode();
        syncThemeToIframe();
      });

      // 모드 변경 시 버튼 텍스트 업데이트
      window.addEventListener('modechange', (e) => {
        modeToggle.textContent =
          e.detail.mode === 'dark' ? 'Light Mode' : 'Dark Mode';
      });

      // 초기 버튼 텍스트 설정
      modeToggle.textContent =
        themeManager.getMode() === 'dark' ? 'Light Mode' : 'Dark Mode';

      // 페이지 로드 함수
      function loadPage(event, element) {
        event.preventDefault();
        const page = element.getAttribute('data-page');
        const iframe = document.getElementById('content-iframe');
        iframe.src = page;

        // 활성 상태 업데이트
        document.querySelectorAll('.nav-item').forEach((item) => {
          item.classList.remove('active');
        });
        element.classList.add('active');
      }

      // iframe에 테마 동기화
      function syncThemeToIframe() {
        const iframe = document.getElementById('content-iframe');
        if (iframe && iframe.contentWindow) {
          const iframeDoc =
            iframe.contentDocument || iframe.contentWindow.document;
          const iframeHtml = iframeDoc.documentElement;

          // 테마 속성 동기화
          iframeHtml.setAttribute(
            'data-theme',
            document.documentElement.getAttribute('data-theme')
          );

          // 다크 모드 클래스 동기화
          if (document.documentElement.classList.contains('dark')) {
            iframeHtml.classList.add('dark');
          } else {
            iframeHtml.classList.remove('dark');
          }
        }
      }

      // iframe 로드 시 테마 동기화
      document
        .getElementById('content-iframe')
        .addEventListener('load', syncThemeToIframe);
    </script>
  </body>
</html>
